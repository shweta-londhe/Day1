<!DOCTYPE html>
<html>
<head>
    <title>Temperature Converter</title>
</head>
<body>

    <h2>Temperature Converter</h2>

    <script>
        let choice = prompt(
            "Enter 1 for Celsius to Fahrenheit\nEnter 2 for Fahrenheit to Celsius"
        );

        if (choice == "1") {

            let celsius = Number(prompt("Enter Celsius"));

            let fahrenheit = (celsius * 9 / 5) + 32;

            document.write("Fahrenheit = " + fahrenheit);

        } else if (choice == "2") {

            let fahrenheit = Number(prompt("Enter Fahrenheit"));

            let celsius = (fahrenheit - 32) * 5 / 9;

            document.write("Celsius = " + celsius);

        } else {

            document.write("Invalid Choice");

        }
    </script>

</body>
</html>
