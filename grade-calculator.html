<!DOCTYPE html>
<html>
<head>
    <title>Grade Calculator</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:10px;
            width:350px;
            text-align:center;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        input, button{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        #result{
            margin-top:20px;
            font-size:20px;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Grade Calculator</h2>

    <input type="number" id="marks" placeholder="Enter Marks">

    <button onclick="calculateGrade()">
        Calculate Grade
    </button>

    <div id="result"></div>

</div>

<script>

function calculateGrade(){

    let marks = Number(document.getElementById("marks").value);

    let grade;

    if(marks >= 90){
        grade = "A+";
    }
    else if(marks >= 80){
        grade = "A";
    }
    else if(marks >= 70){
        grade = "B";
    }
    else if(marks >= 60){
        grade = "C";
    }
    else if(marks >= 40){
        grade = "D";
    }
    else{
        grade = "Fail";
    }

    document.getElementById("result").innerHTML =
    "Grade: " + grade;
}

</script>

</body>
</html>
