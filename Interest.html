<!DOCTYPE html>
<html>
<head>
    <title>Interest Calculator</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:10px;
            width:400px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
            text-align:center;
        }

        input, select, button{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        button{
            cursor:pointer;
        }

        #result{
            margin-top:20px;
            font-size:20px;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Interest Calculator</h2>

    <input type="number" id="principal" placeholder="Principal Amount">

    <input type="number" id="rate" placeholder="Rate (%)">

    <input type="number" id="time" placeholder="Time (Years)">

    <select id="interestType">
        <option value="simple">Simple Interest</option>
        <option value="compound">Compound Interest</option>
    </select>

    <button onclick="calculateInterest()">
        Calculate
    </button>

    <div id="result"></div>

</div>

<script>

function calculateInterest(){

    let p = Number(document.getElementById("principal").value);
    let r = Number(document.getElementById("rate").value);
    let t = Number(document.getElementById("time").value);

    let type = document.getElementById("interestType").value;

    let result;

    if(type === "simple"){

        result = (p * r * t) / 100;

        document.getElementById("result").innerHTML =
        "Simple Interest = ₹" + result;

    }else{

        result = p * Math.pow((1 + r/100), t) - p;

        document.getElementById("result").innerHTML =
        "Compound Interest = ₹" + result.toFixed(2);

    }
}

</script>

</body>
</html>
