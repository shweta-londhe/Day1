<!DOCTYPE html>
<html>
<head>
    <title>ATM Withdrawal Simulation</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:10px;
            width:350px;
            text-align:center;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        input, button{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        #result{
            margin-top:20px;
            font-size:18px;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>ATM Withdrawal</h2>

    <input type="number" id="amount" placeholder="Enter Amount">

    <button onclick="withdraw()">Withdraw</button>

    <div id="result"></div>

</div>

<script>

let balance = 10000;

function withdraw(){

    let amount = Number(document.getElementById("amount").value);

    if(amount <= 0){

        document.getElementById("result").innerHTML =
        "Enter a valid amount";

    }
    else if(amount > balance){

        document.getElementById("result").innerHTML =
        "Insufficient Balance";

    }
    else{

        balance = balance - amount;

        document.getElementById("result").innerHTML =
        "Withdrawal Successful<br>Remaining Balance = ₹" + balance;
    }
}

</script>

</body>
</html>
